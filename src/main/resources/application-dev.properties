# ==============================
# DEVELOPMENT CONFIGURATION
# ==============================

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/studentdb
spring.datasource.username=postgres
spring.datasource.password=Microsoft#1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=YOUR_EXISTING_JWT_SECRET
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration-days=7

# Logging
logging.level.root=INFO
logging.level.com.example.studentmanagement=DEBUG
logging.file.name=logs/student-management.log